<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Input Validation Using HTML5 Form Controls With JS Validators</title>
<style>
    input:invalid {
        border: red solid 3px;
    }
</style>
</head>
<body>
    <form>
        <input type="text" id="account" name="account" pattern="^[0-9]{5,15}$">
      <button>Submit</button>
    </form>
    
    <script>
        const account = document.getElementById("account");

        account.addEventListener("input", function (event){
            if (account.validity.patternMismatch) {
                account.setCustomValidity("Account number is invalid");
            } else {
                account.setCustomValidity("");
            }
        });
    </script>
</body>
</html>
